    repos:
      github.com/openaire/EPrints-OAPiwik get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_decisive_wildcat.sh
        container: qc.ver_plum_bold_donkey
timeout: 5400
